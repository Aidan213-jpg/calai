<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CalAI</title>
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="CalAI">
  <meta name="theme-color" content="#7c6dfa">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root {
  --bg: #0d0d12;
  --s1: #16161f;
  --s2: #1e1e2a;
  --s3: #272736;
  --border: #2a2a3a;
  --accent: #7c6dfa;
  --accent-glow: rgba(124,109,250,0.18);
  --green: #4ade80;
  --green-dim: rgba(74,222,128,0.15);
  --orange: #fb923c;
  --blue: #60a5fa;
  --red: #f87171;
  --text: #ededf5;
  --text2: #8888a8;
  --text3: #55556a;
  --r: 14px;
  --r-sm: 8px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;font-size:15px;display:flex;flex-direction:column}

/* SCROLLBAR */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* LAYOUT */
#app{flex:1;overflow:hidden;display:flex;flex-direction:column}
#view{flex:1;overflow-y:auto;padding:16px 16px 0}
#nav{flex-shrink:0;background:var(--s1);border-top:1px solid var(--border);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:10}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;cursor:pointer;transition:color .2s;color:var(--text3);background:none;border:none;font-family:inherit}
.nav-btn.active{color:var(--accent)}
.nav-btn svg{width:22px;height:22px}
.nav-btn span{font-size:10px;font-weight:500;letter-spacing:.3px}

/* HEADER */
.view-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-top:4px}
.view-header h1{font-size:22px;font-weight:700;letter-spacing:-.3px}
.view-header .sub{font-size:13px;color:var(--text2);margin-top:2px}

/* CARDS */
.card{background:var(--s1);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card+.card{margin-top:12px}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 18px;border-radius:var(--r-sm);font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border:none;transition:all .15s;white-space:nowrap}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{filter:brightness(1.15)}
.btn-ghost{background:var(--s3);color:var(--text)}
.btn-ghost:hover{background:var(--border)}
.btn-danger{background:rgba(248,113,113,.15);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:13px;border-radius:6px}
.btn-icon{width:36px;height:36px;padding:0;border-radius:50%;background:var(--s3)}
.btn-full{width:100%}
.icon-btn{background:none;border:none;color:var(--text2);cursor:pointer;padding:4px;border-radius:6px;display:flex;align-items:center;justify-content:center}
.icon-btn:hover{color:var(--text);background:var(--s3)}

/* FAB */
#fab{position:fixed;bottom:calc(72px + env(safe-area-inset-bottom));right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(124,109,250,.4);transition:transform .15s,box-shadow .15s;z-index:20}
#fab:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(124,109,250,.5)}
#fab svg{width:24px;height:24px;color:#fff}

/* MODAL */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(4px)}
#overlay.open{display:flex}
.modal{background:var(--s1);border-radius:var(--r) var(--r) 0 0;width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;animation:slideUp .25s ease}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.modal-header h2{font-size:17px;font-weight:700}
.modal-body{overflow-y:auto;flex:1;padding:16px 20px}
.modal-footer{padding:12px 20px;border-top:1px solid var(--border);flex-shrink:0}
.drag-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:10px auto 0}

/* TABS */
.tabs{display:flex;background:var(--s2);border-radius:var(--r-sm);padding:3px;gap:2px;margin-bottom:16px}
.tab{flex:1;padding:7px;text-align:center;font-size:13px;font-weight:600;border-radius:6px;cursor:pointer;color:var(--text2);border:none;background:none;font-family:inherit;transition:all .15s}
.tab.active{background:var(--s3);color:var(--text)}

/* INPUTS */
.input{width:100%;padding:10px 14px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-family:inherit;font-size:14px;outline:none;transition:border-color .15s}
.input:focus{border-color:var(--accent)}
.input::placeholder{color:var(--text3)}
textarea.input{resize:none;line-height:1.5}
.input-row{display:flex;gap:8px;align-items:center}
.label{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}

/* FOOD LIST ITEMS */
.food-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border)}
.food-item:last-child{border-bottom:none}
.food-icon{width:36px;height:36px;border-radius:50%;background:var(--s3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.food-name{font-size:14px;font-weight:600;flex:1;min-width:0}
.food-meta{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.food-cal{font-size:15px;font-weight:700;color:var(--accent);flex-shrink:0}
.food-macros{display:flex;gap:10px;font-size:11px;color:var(--text2)}
.food-macros span{white-space:nowrap}
.macro-p{color:#60a5fa}
.macro-c{color:#fbbf24}
.macro-f{color:#f87171}

/* CALORIE RING */
.ring-wrap{display:flex;justify-content:center;margin:8px 0 16px}
.ring-svg{}
.ring-track{fill:none;stroke:var(--s3)}
.ring-fill{fill:none;stroke:var(--accent);stroke-linecap:round;transition:stroke-dashoffset .6s ease}
.ring-center{text-anchor:middle;dominant-baseline:middle}
.ring-cal{font-size:26px;font-weight:800;fill:var(--text)}
.ring-label{font-size:12px;fill:var(--text2)}

/* MACRO BARS */
.macro-bar-wrap{margin-bottom:10px}
.macro-bar-header{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.macro-bar-label{font-weight:600}
.macro-bar-val{color:var(--text2)}
.macro-bar-track{height:6px;background:var(--s3);border-radius:3px;overflow:hidden}
.macro-bar-fill{height:100%;border-radius:3px;transition:width .5s ease}

/* MEAL SECTIONS */
.meal-section{margin-bottom:12px}
.meal-section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.meal-section-title{font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px}
.meal-section-cal{font-size:12px;color:var(--text2)}

/* MEAL PREP CARD */
.prep-card{background:var(--s2);border-radius:var(--r);padding:14px;border:1px solid var(--border);cursor:pointer;transition:border-color .15s}
.prep-card:hover{border-color:var(--accent)}
.prep-card-name{font-size:15px;font-weight:700;margin-bottom:4px}
.prep-card-meta{font-size:12px;color:var(--text2)}
.prep-card-cals{font-size:18px;font-weight:800;color:var(--accent);margin:6px 0 4px}

/* HISTORY */
.history-day{background:var(--s2);border-radius:var(--r);padding:14px 16px;border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:border-color .15s}
.history-day:hover{border-color:var(--accent)}
.history-day-header{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.history-day-date{font-size:14px;font-weight:700}
.history-day-cal{font-size:16px;font-weight:800;color:var(--accent)}

/* SETTINGS */
.setting-row{padding:14px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:14px;font-weight:600}
.setting-sub{font-size:12px;color:var(--text2);margin-top:2px}
.badge{display:inline-flex;align-items:center;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
.badge-green{background:var(--green-dim);color:var(--green)}
.badge-red{background:rgba(248,113,113,.15);color:var(--red)}

/* CHAT */
.chat-messages{min-height:80px;max-height:200px;overflow-y:auto;margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.chat-msg{padding:8px 12px;border-radius:var(--r-sm);font-size:13px;line-height:1.5;max-width:90%}
.chat-msg.user{background:var(--accent);color:#fff;align-self:flex-end}
.chat-msg.ai{background:var(--s3);align-self:flex-start}
.chat-msg.ai.thinking{color:var(--text2);font-style:italic}

/* SEARCH RESULTS */
.search-result{padding:10px 12px;background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);cursor:pointer;transition:border-color .15s;margin-bottom:6px}
.search-result:hover{border-color:var(--accent)}
.search-result-name{font-size:14px;font-weight:600;margin-bottom:2px}
.search-result-meta{font-size:12px;color:var(--text2)}

/* PHOTO ZONE */
.photo-zone{border:2px dashed var(--border);border-radius:var(--r);padding:32px;text-align:center;cursor:pointer;transition:all .2s;position:relative;overflow:hidden}
.photo-zone:hover,.photo-zone.drag{border-color:var(--accent);background:var(--accent-glow)}
.photo-zone img{max-width:100%;border-radius:8px;margin-top:12px;display:none}
.photo-zone.has-img img{display:block}
.photo-zone.has-img .photo-placeholder{display:none}
.photo-placeholder{pointer-events:none}

/* SPINNER */
.spinner{width:20px;height:20px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* EMPTY STATE */
.empty{text-align:center;padding:40px 20px;color:var(--text2)}
.empty svg{width:48px;height:48px;margin-bottom:12px;opacity:.3}
.empty h3{font-size:16px;font-weight:700;color:var(--text);margin-bottom:6px}
.empty p{font-size:13px}

/* TOAST */
#toast{position:fixed;bottom:calc(80px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(20px);background:var(--s3);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 18px;font-size:13px;font-weight:600;z-index:200;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* NUTRIENT GRID */
.nutrient-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.nutrient-cell{background:var(--s3);border-radius:var(--r-sm);padding:8px 10px}
.nutrient-val{font-size:17px;font-weight:800;margin-bottom:2px}
.nutrient-label{font-size:11px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.4px}

/* UTIL */
.flex{display:flex}.gap-8{gap:8px}.gap-12{gap:12px}.items-center{align-items:center}
.mt-8{margin-top:8px}.mt-12{margin-top:12px}.mt-16{margin-top:16px}
.text-sm{font-size:13px}.text-xs{font-size:11px}.text-muted{color:var(--text2)}
.fw-bold{font-weight:700}.text-center{text-align:center}
.w-full{width:100%}
.divider{height:1px;background:var(--border);margin:12px 0}

/* PILL */
.pill{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600;background:var(--s3);color:var(--text2)}

/* WATER TRACKER */
.water-drops{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.drop{width:32px;height:32px;border-radius:50%;border:2px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .15s;background:var(--s3)}
.drop.filled{background:#1e3a5f;border-color:#60a5fa}

/* CHART */
.bar-chart{display:flex;align-items:flex-end;gap:6px;height:80px;margin:8px 0}
.bar-col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-fill{width:100%;border-radius:4px 4px 0 0;min-height:3px;transition:height .4s ease;background:var(--accent)}
.bar-label{font-size:10px;color:var(--text3);text-align:center}
.bar-val{font-size:9px;color:var(--text2);text-align:center}

/* WEIGHT */
.weight-entry{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.weight-entry:last-child{border-bottom:none}

/* STREAK */
.streak-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12px;font-weight:700;background:rgba(251,191,36,.12);color:#fbbf24}

/* SUGGESTION CARD */
.suggestion{background:var(--s2);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:6px;cursor:pointer;transition:border-color .15s}
.suggestion:hover{border-color:var(--accent)}
</style>
</head>
<body>
<div id="app">
  <div id="view"></div>
  <nav id="nav">
    <button class="nav-btn active" data-view="today" onclick="setView('today')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg>
      <span>Today</span>
    </button>
    <button class="nav-btn" data-view="history" onclick="setView('history')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
      <span>History</span>
    </button>
    <button class="nav-btn" data-view="mealpreps" onclick="setView('mealpreps')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11v3a9 9 0 0 0 18 0v-3"/><path d="M3 11h18"/><path d="M12 2v9"/></svg>
      <span>Meal Preps</span>
    </button>
    <button class="nav-btn" data-view="settings" onclick="setView('settings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span>Settings</span>
    </button>
  </nav>
</div>

<button id="fab" onclick="openAddFood()">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<div id="overlay" onclick="handleOverlayClick(event)">
  <div class="modal" id="modal">
    <div class="drag-handle"></div>
    <div class="modal-header">
      <h2 id="modal-title">Add Food</h2>
      <button class="icon-btn" onclick="closeModal()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer" style="display:none"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── USDA DEMO KEY ───────────────────────────────────────────────
const USDA_KEY = 'DEMO_KEY';

// ─── STATE ───────────────────────────────────────────────────────
let state = {
  view: 'today',
  selectedDate: todayStr(),
  log: {},        // { "2026-05-27": [ {id, meal, name, emoji, cal, protein, carbs, fat, qty, unit} ] }
  preps: [],      // [ {id, name, emoji, desc, foods, notes, servings} ]
  customFoods: [],
  water: {},      // { "2026-05-27": 6 }  glasses per day
  weights: [],    // [ {date, weight} ]
  notes: {},      // { "2026-05-27": "felt good today" }
  favorites: [],  // [ food objects ]
  templates: [],  // same structure as preps but single-meal
  settings: {
    apiKey: '',
    googleClientId: '',
    driveFolderId: '1Vmni3ZAJrm_-Hh_Q08bHMLRXGfh_fLnX',
    name: '',
    calorieGoal: 2000,
    proteinGoal: 150,
    carbGoal: 200,
    fatGoal: 65,
    driveFileId: null,
    driveSynced: false
  }
};

// ─── HELPERS ─────────────────────────────────────────────────────
function todayStr() {
  return new Date().toISOString().split('T')[0];
}
function formatDate(str) {
  const d = new Date(str + 'T00:00:00');
  const today = todayStr();
  const yesterday = new Date();
  yesterday.setDate(yesterday.getDate()-1);
  const yStr = yesterday.toISOString().split('T')[0];
  if (str === today) return 'Today';
  if (str === yStr) return 'Yesterday';
  return d.toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric'});
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2); }

function calcStreak() {
  let streak = 0;
  const d = new Date();
  // Don't penalise if today has no log yet
  const todayHasLog = dayLog(todayStr()).length > 0;
  if (!todayHasLog) d.setDate(d.getDate() - 1);
  while (true) {
    const s = d.toISOString().split('T')[0];
    if (dayLog(s).length > 0) { streak++; d.setDate(d.getDate()-1); }
    else break;
  }
  return streak;
}

function getWater(date) { return state.water[date] || 0; }
function setWater(date, val) { state.water[date] = Math.max(0, val); save(); render(); }
function toast(msg, dur=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), dur);
}
function dayLog(date) { return state.log[date] || []; }
function dayTotals(date) {
  const foods = dayLog(date);
  return foods.reduce((acc, f) => {
    acc.cal += (f.cal||0)*f.qty;
    acc.protein += (f.protein||0)*f.qty;
    acc.carbs += (f.carbs||0)*f.qty;
    acc.fat += (f.fat||0)*f.qty;
    return acc;
  }, {cal:0, protein:0, carbs:0, fat:0});
}
function round1(n){ return Math.round(n*10)/10; }
function clamp(n,min,max){return Math.min(max,Math.max(min,n))}

// ─── PERSIST (localStorage) ───────────────────────────────────────
function save() {
  localStorage.setItem('calai_state', JSON.stringify(state));
  driveSaveDebounced();
}
function load() {
  try {
    const raw = localStorage.getItem('calai_state');
    if (raw) {
      const parsed = JSON.parse(raw);
      state = { ...state, ...parsed };
    }
  } catch(e) {}
}

// ─── GOOGLE DRIVE SYNC ───────────────────────────────────────────
let driveReady = false;
let driveToken = null;
let driveSaveTimer = null;

function driveSaveDebounced() {
  if (!driveReady || !driveToken) return;
  clearTimeout(driveSaveTimer);
  driveSaveTimer = setTimeout(driveSave, 3000);
}

async function initDrive() {
  const clientId = state.settings.googleClientId;
  if (!clientId) return;
  if (typeof google === 'undefined') {
    toast('Google API not loaded — check your connection');
    return;
  }
  try {
    const tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: clientId,
      scope: 'https://www.googleapis.com/auth/drive.file',
      callback: async (resp) => {
        if (resp.error) { toast('Drive auth failed: ' + resp.error); return; }
        driveToken = resp.access_token;
        driveReady = true;
        state.settings.driveSynced = true;
        toast('✓ Google Drive connected!');
        await driveLoad();
        render();
      }
    });
    tokenClient.requestAccessToken();
  } catch(e) {
    toast('Drive init error: ' + e.message);
  }
}

function getDriveFileName() {
  const n = (state.settings.name||'default').toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  return `calai-${n}.json`;
}

async function driveSave() {
  if (!driveReady || !driveToken) return;
  const body = JSON.stringify(state);
  const folderId = state.settings.driveFolderId;
  const fileName = getDriveFileName();
  const meta = {name: fileName, mimeType:'application/json', ...(folderId ? {parents:[folderId]} : {})};
  try {
    if (state.settings.driveFileId) {
      await fetch(`https://www.googleapis.com/upload/drive/v3/files/${state.settings.driveFileId}?uploadType=media`, {
        method: 'PATCH',
        headers: {'Authorization':'Bearer '+driveToken,'Content-Type':'application/json'},
        body
      });
    } else {
      const r = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart', {
        method: 'POST',
        headers: {'Authorization':'Bearer '+driveToken,'Content-Type':'multipart/related; boundary=boundary123'},
        body: `--boundary123\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(meta)}\r\n--boundary123\r\nContent-Type: application/json\r\n\r\n${body}\r\n--boundary123--`
      });
      const file = await r.json();
      state.settings.driveFileId = file.id;
      localStorage.setItem('calai_state', JSON.stringify(state));
    }
  } catch(e) { console.warn('Drive save failed', e); }
}

async function driveLoad() {
  if (!driveReady || !driveToken) return;
  try {
    let fileId = state.settings.driveFileId;
    if (!fileId) {
      const folderQ = state.settings.driveFolderId ? ` and '${state.settings.driveFolderId}' in parents` : '';
      const fileName = getDriveFileName();
      const r = await fetch(`https://www.googleapis.com/drive/v3/files?q=name='${fileName}'${folderQ}&fields=files(id)`, {
        headers: {'Authorization':'Bearer '+driveToken}
      });
      const data = await r.json();
      if (data.files && data.files.length) fileId = data.files[0].id;
    }
    if (fileId) {
      const r = await fetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`, {
        headers: {'Authorization':'Bearer '+driveToken}
      });
      const remote = await r.json();
      // Merge: remote wins for settings, but merge log & preps
      state.log = {...state.log, ...remote.log};
      state.preps = remote.preps || state.preps;
      state.customFoods = remote.customFoods || state.customFoods;
      // Merge settings but never overwrite local keys with empty remote values
      const merged = {...state.settings, ...remote.settings, driveFileId: fileId};
      if (!remote.settings?.apiKey) merged.apiKey = state.settings.apiKey;
      if (!remote.settings?.googleClientId) merged.googleClientId = state.settings.googleClientId;
      state.settings = merged;
      save();
      toast('↓ Synced from Drive');
    }
  } catch(e) { console.warn('Drive load failed', e); }
}

// ─── CLAUDE API ──────────────────────────────────────────────────
function extractJSON(text) {
  // Strip markdown code blocks if present
  text = text.replace(/```(?:json)?\s*/gi, '').replace(/```/g, '').trim();
  // Find the first JSON array or object anywhere in the response
  const arrMatch = text.match(/\[[\s\S]*\]/);
  const objMatch = text.match(/\{[\s\S]*\}/);
  if (arrMatch) return arrMatch[0];
  if (objMatch) return objMatch[0];
  return text;
}

async function callClaude(messages, system='') {
  const key = state.settings.apiKey;
  if (!key) { toast('⚠️ Add your Anthropic API key in Settings'); throw new Error('no key'); }
  const resp = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: {
      'x-api-key': key,
      'anthropic-version': '2023-06-01',
      'content-type': 'application/json',
      'anthropic-dangerous-direct-browser-access': 'true'
    },
    body: JSON.stringify({
      model: 'claude-opus-4-6',
      max_tokens: 1024,
      system: system || `You are a nutrition assistant. Return ONLY valid JSON, no markdown, no explanation.`,
      messages
    })
  });
  if (!resp.ok) {
    const err = await resp.json().catch(()=>({}));
    throw new Error(err.error?.message || 'API error ' + resp.status);
  }
  const data = await resp.json();
  return data.content[0].text;
}

async function analyzePhoto(base64, mediaType) {
  const sys = `You are a food nutrition analyzer. The user sends a photo of food. 
Return ONLY a JSON array of food items detected. Each item: {name, emoji, cal, protein, carbs, fat, qty, unit}.
All numbers are per-serving (qty=1 means the full item). Estimate realistic nutrition values.
Example: [{"name":"Grilled Chicken Breast","emoji":"🍗","cal":165,"protein":31,"carbs":0,"fat":3.6,"qty":1,"unit":"piece"}]`;
  const text = await callClaude([{
    role: 'user',
    content: [{type:'image',source:{type:'base64',media_type:mediaType,data:base64}},
              {type:'text',text:'What food items are in this image? Return JSON array.'}]
  }], sys);
  return JSON.parse(extractJSON(text));
}

async function parseTextToFoods(text) {
  const sys = `You are a food nutrition parser. The user describes what they ate.
Return ONLY a JSON array of food items. Each: {name, emoji, cal, protein, carbs, fat, qty, unit}.
All nutrition per single serving (multiply by qty for total). Estimate realistically.
Example input: "I had 2 eggs and a bowl of oatmeal with honey"
Example output: [{"name":"Scrambled Eggs","emoji":"🥚","cal":74,"protein":6,"carbs":0.4,"fat":5,"qty":2,"unit":"egg"},{"name":"Oatmeal with Honey","emoji":"🍯","cal":180,"protein":5,"carbs":34,"fat":3,"qty":1,"unit":"bowl"}]`;

async function parseMealPrep(text) {
  const sys = `You are a meal prep assistant. The user describes a meal prep session.

The foods array should represent nutrition for ONE serving.

// ─── AI FOOD SEARCH ──────────────────────────────────────────────
async function searchFoodsAI(query) {

Include common serving sizes people actually use. Each item: {name, emoji, cal, protein, carbs, fat, qty, unit, brand}.
brand is optional (use for packaged foods). All nutrition values are per one serving (qty=1).

function guessEmoji(name) {
  const n = name.toLowerCase();
  if (/chicken/.test(n)) return '🍗';
  if (/egg/.test(n)) return '🥚';
  if (/apple/.test(n)) return '🍎';
  if (/banana/.test(n)) return '🍌';
  if (/rice/.test(n)) return '🍚';
  if (/bread|toast/.test(n)) return '🍞';
  if (/milk/.test(n)) return '🥛';
  if (/coffee/.test(n)) return '☕';
  if (/pizza/.test(n)) return '🍕';
  if (/burger|beef/.test(n)) return '🍔';
  if (/salmon|fish|tuna/.test(n)) return '🐟';
  if (/broccoli|vegetable|veggie/.test(n)) return '🥦';
  if (/protein|whey/.test(n)) return '💪';
  if (/yogurt/.test(n)) return '🥛';
  if (/oat/.test(n)) return '🥣';
  if (/pasta|noodle/.test(n)) return '🍝';
  if (/salad/.test(n)) return '🥗';
  if (/sandwich/.test(n)) return '🥪';
  if (/cookie|cake/.test(n)) return '🍪';
  if (/chocolate/.test(n)) return '🍫';
  return '🍽️';
}

function renderMacroPie(p, c, f) {
  const total = p + c + f || 1;
  const pP = p/total, pC = c/total, pF = f/total;
  const r = 40, cx = 50, cy = 50;
  function slice(start, end, color) {
    if (end - start < 0.001) return '';
    const s = start * 2 * Math.PI - Math.PI/2;
    const e = end * 2 * Math.PI - Math.PI/2;
    const x1 = cx + r*Math.cos(s), y1 = cy + r*Math.sin(s);
    const x2 = cx + r*Math.cos(e), y2 = cy + r*Math.sin(e);
    const large = (end-start) > 0.5 ? 1 : 0;
    return `<path d="M${cx},${cy} L${x1},${y1} A${r},${r} 0 ${large},1 ${x2},${y2} Z" fill="${color}" opacity="0.9"/>`;
  }
  return `<svg width="100" height="100" viewBox="0 0 100 100" style="flex-shrink:0">
    ${slice(0, pP, '#60a5fa')}
    ${slice(pP, pP+pC, '#fbbf24')}
    ${slice(pP+pC, 1, '#f87171')}
    <circle cx="${cx}" cy="${cy}" r="18" fill="var(--s1)"/>
  </svg>`;
}

async function clearAppCache() {
  try {
    // Unregister all service workers
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    // Delete all caches
    const keys = await caches.keys();
    await Promise.all(keys.map(k => caches.delete(k)));
    toast('✓ Cache cleared — reloading...');
    setTimeout(() => location.reload(true), 1000);
  } catch(e) {
    toast('Error: ' + e.message);
  }
}

function exportData() {
  const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'calai-backup-'+todayStr()+'.json';
  a.click();
}

function importData(e) {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const imported = JSON.parse(ev.target.result);
      state = {...state,...imported};
      save(); render();
      toast('✓ Data imported!');
    } catch { toast('⚠️ Invalid file'); }
  };
  reader.readAsText(file);
}

let _barcodeStream = null;

async function startBarcodeCamera() {
  const video = document.getElementById('barcode-video');
  const status = document.getElementById('barcode-status');
  if (!video) return;
  try {
    _barcodeStream = await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    video.srcObject = _barcodeStream;
    video.style.display = 'block';
    if (status) status.innerHTML = '<div class="flex gap-8 items-center"><div class="spinner" style="width:14px;height:14px"></div> Point camera at barcode...</div>';

    if ('BarcodeDetector' in window) {
      const detector = new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});
      const scan = async () => {
        if (!document.getElementById('barcode-video')) { stopBarcodeCamera(); return; }
        try {
          const codes = await detector.detect(video);
          if (codes.length) {
            stopBarcodeCamera();
            const barcode = codes[0].rawValue;
            if (status) status.innerHTML = `<span style="color:var(--green)">✓ Scanned: ${barcode}</span>`;
            await lookupBarcodeValue(barcode);
            return;
          }
        } catch(e) {}
        requestAnimationFrame(scan);
      };
      video.onloadeddata = () => requestAnimationFrame(scan);
    } else {
      if (status) status.innerHTML = `<div class="text-xs text-muted">BarcodeDetector not supported on this browser. Enter barcode manually above.</div>`;
    }
  } catch(e) {
    if (status) status.innerHTML = `<span style="color:var(--red)">⚠️ Camera access denied</span>`;
  }
}

function stopBarcodeCamera() {
  if (_barcodeStream) { _barcodeStream.getTracks().forEach(t=>t.stop()); _barcodeStream = null; }
  const v = document.getElementById('barcode-video');

}

async function lookupBarcode() {

async function lookupBarcodeValue(barcode) {
  const status = document.getElementById('barcode-status');
  const result = document.getElementById('barcode-result');
  if (status) status.innerHTML = '<div class="flex gap-8 items-center"><div class="spinner" style="width:14px;height:14px"></div> Looking up product...</div>';
  if (result) result.innerHTML = '';
  try {
    const r = await fetch(`https://world.openfoodfacts.org/api/v0/product/${barcode}.json`);
    const data = await r.json();
    if (data.status === 1 && data.product) {
      const p = data.product;
      const n = p.nutriments || {};
      const food = {
        name: p.product_name || p.abbreviated_product_name || 'Unknown Product',
        brand: p.brands || '',
        emoji: guessEmoji(p.product_name || ''),
        cal: Math.round(n['energy-kcal_100g'] || n['energy-kcal'] || 0),
        protein: round1(n.proteins_100g || 0),
        carbs: round1(n.carbohydrates_100g || 0),
        fat: round1(n.fat_100g || 0),
        qty: 1,
        unit: '100g'
      };
      if (status) status.innerHTML = `<span style="color:var(--green)">✓ Found: ${food.name}</span>`;
      if (result) result.innerHTML = `
        <div class="search-result" style="margin-top:8px" onclick='openServingPicker(${JSON.stringify(food).replace(/'/g,"&apos;")})'>
          <div class="search-result-name">${food.emoji} ${food.name}${food.brand?' · <span style="color:var(--text3);font-size:12px">'+food.brand+'</span>':''}</div>
          <div class="search-result-meta">${food.cal} kcal · P:${food.protein}g · C:${food.carbs}g · F:${food.fat}g per 100g</div>
        </div>`;
    } else {
      // Not in Open Food Facts — fall back to Claude
      if (status) status.innerHTML = '<div class="flex gap-8 items-center"><div class="spinner" style="width:14px;height:14px"></div> Not in database — asking AI...</div>';
      const foods = await searchFoodsAI('product with barcode ' + barcode);
      if (result && foods.length) {
        if (status) status.innerHTML = `<span style="color:var(--text2)">AI estimate (barcode not in database)</span>`;
        result.innerHTML = foods.slice(0,3).map(f=>`
          <div class="search-result" style="margin-top:6px" onclick='openServingPicker(${JSON.stringify(f).replace(/'/g,"&apos;")})'>
            <div class="search-result-name">${f.emoji} ${f.name}</div>
            <div class="search-result-meta">${f.cal} kcal · P:${f.protein}g · C:${f.carbs}g · F:${f.fat}g</div>
          </div>`).join('');
      }
    }
  } catch(e) {
    if (status) status.innerHTML = `<span style="color:var(--red)">⚠️ Lookup failed: ${e.message}</span>`;
  }
}

  <button class="btn btn-primary btn-full" onclick="buildRecipe()" style="margin-bottom:12px">Calculate Nutrition</button>
  <div id="recipe-result"></div>`;
}

async function buildRecipe() {
  const input = document.getElementById('recipe-input')?.value?.trim();
  if (!input) { toast('Describe your recipe'); return; }
  const result = document.getElementById('recipe-result');
  if (result) result.innerHTML = '<div class="flex gap-8 items-center"><div class="spinner"></div> Calculating...</div>';
  const sys = `You are a recipe nutrition calculator. The user describes a recipe.
Return ONLY a JSON object: {name, emoji, servings, notes, foods:[{name,emoji,cal,protein,carbs,fat,qty,unit}]}
foods = ingredients per ONE serving. Calculate all values accurately based on the ingredients listed.`;
  try {
    const r = await callClaude([{role:'user',content:input}], sys);
    const recipe = JSON.parse(extractJSON(r));
    const totalCal = (recipe.foods||[]).reduce((s,f)=>s+(f.cal||0)*f.qty,0);
    const totalP = (recipe.foods||[]).reduce((s,f)=>s+(f.protein||0)*f.qty,0);
    if (result) result.innerHTML = `
      <div class="card">
        <div style="font-size:18px;font-weight:800;margin-bottom:4px">${recipe.emoji||'🍽️'} ${recipe.name}</div>
        <div class="text-sm text-muted" style="margin-bottom:12px">${recipe.servings} servings</div>
        <div class="nutrient-grid" style="margin-bottom:12px">
          <div class="nutrient-cell"><div class="nutrient-val" style="color:var(--accent)">${Math.round(totalCal)}</div><div class="nutrient-label">Cal/serving</div></div>
          <div class="nutrient-cell"><div class="nutrient-val" style="color:#60a5fa">${round1(totalP)}g</div><div class="nutrient-label">Protein</div></div>
        </div>
        ${(recipe.foods||[]).map(f=>`<div class="food-macros" style="margin-bottom:4px"><span>${f.emoji||''}${f.name}</span> <span class="text-muted">— ${Math.round((f.cal||0)*f.qty)} kcal</span></div>`).join('')}
        <div class="flex gap-8 mt-12">
          <button class="btn btn-primary" style="flex:1" onclick='saveRecipeAsPrep(${JSON.stringify(recipe).replace(/'/g,"&apos;")})'>Save as Meal Prep</button>
        </div>
      </div>`;
  } catch(e) {
    if (result) result.innerHTML = `<span style="color:var(--red)">⚠️ ${e.message}</span>`;
  }
}

function saveRecipeAsPrep(recipe) {
  recipe.id = uid();
  recipe.desc = 'From Recipe Builder';
  state.preps.push(recipe);
  save(); closeModal();
  setView('mealpreps');
  toast('✓ Saved as meal prep!');
}

function renderTDEEModal() {
  return `
  <div class="label">Biological Sex</div>
  <div class="flex gap-8" style="margin-bottom:12px">
    <button class="btn btn-ghost" id="sex-male" onclick="selectSex('male')" style="flex:1">Male</button>
    <button class="btn btn-ghost" id="sex-female" onclick="selectSex('female')" style="flex:1">Female</button>
  </div>

  <div class="label">Age</div>
  <input class="input" type="number" id="tdee-age" placeholder="e.g. 25" min="10" max="100" style="margin-bottom:12px">

  <div class="label">Height</div>
  <div class="flex gap-8" style="margin-bottom:12px">
    <div style="flex:1">
      <input class="input" type="number" id="tdee-ft" placeholder="ft" min="3" max="8">
    </div>
    <div style="flex:1">
      <input class="input" type="number" id="tdee-in" placeholder="in" min="0" max="11">
    </div>
  </div>

  <div class="label">Weight (lbs)</div>
  <input class="input" type="number" id="tdee-weight" placeholder="e.g. 185" style="margin-bottom:12px">

  <div class="label">Activity Level</div>
  <select class="input" id="tdee-activity" style="margin-bottom:12px">
    <option value="1.2">Sedentary (desk job, little/no exercise)</option>
    <option value="1.375">Lightly Active (1–3 days/week)</option>
    <option value="1.55" selected>Moderately Active (3–5 days/week)</option>
    <option value="1.725">Very Active (6–7 days/week)</option>
    <option value="1.9">Extremely Active (physical job + daily training)</option>
  </select>

  <div class="label">Goal</div>
  <select class="input" id="tdee-goal" style="margin-bottom:16px">
    <option value="-500">Lose weight (−500 kcal/day)</option>
    <option value="-250">Slow cut (−250 kcal/day)</option>
    <option value="0" selected>Maintain weight</option>
    <option value="250">Lean bulk (+250 kcal/day)</option>
    <option value="500">Bulk (+500 kcal/day)</option>
  </select>

  <div id="tdee-result" style="display:none;background:var(--s2);border-radius:var(--r);padding:14px;margin-bottom:16px">
    <div style="font-size:13px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px">Calculated Goals</div>
    <div class="nutrient-grid">
      <div class="nutrient-cell"><div class="nutrient-val" id="res-cal" style="color:var(--accent)">—</div><div class="nutrient-label">Calories</div></div>
      <div class="nutrient-cell"><div class="nutrient-val" id="res-p" style="color:#60a5fa">—</div><div class="nutrient-label">Protein (g)</div></div>
      <div class="nutrient-cell"><div class="nutrient-val" id="res-c" style="color:#fbbf24">—</div><div class="nutrient-label">Carbs (g)</div></div>
      <div class="nutrient-cell"><div class="nutrient-val" id="res-f" style="color:#f87171">—</div><div class="nutrient-label">Fat (g)</div></div>
    </div>
    <div id="res-note" class="text-xs text-muted mt-8"></div>
  </div>

  <div class="flex gap-8">
    <button class="btn btn-ghost" style="flex:1" onclick="calcTDEE()">Calculate</button>
    <button class="btn btn-primary" style="flex:1" id="apply-btn" onclick="applyTDEE()" style="display:none">Apply Goals</button>
  </div>`;
}

let _tdeeResults = null;
let _selectedSex = 'male';

function selectSex(sex) {
  _selectedSex = sex;
  document.getElementById('sex-male').className = 'btn ' + (sex==='male' ? 'btn-primary' : 'btn-ghost');
  document.getElementById('sex-female').className = 'btn ' + (sex==='female' ? 'btn-primary' : 'btn-ghost');
  document.getElementById('sex-male').style.flex = '1';
  document.getElementById('sex-female').style.flex = '1';
}

function calcTDEE() {
  const age = +document.getElementById('tdee-age')?.value;
  const ft = +document.getElementById('tdee-ft')?.value || 0;
  const inches = +document.getElementById('tdee-in')?.value || 0;
  const weightLbs = +document.getElementById('tdee-weight')?.value;
  const activity = +document.getElementById('tdee-activity')?.value;
  const goalDelta = +document.getElementById('tdee-goal')?.value;

  if (!age || !weightLbs || (!ft && !inches)) { toast('Fill in all fields'); return; }

  // Convert to metric
  const heightCm = (ft * 12 + inches) * 2.54;
  const weightKg = weightLbs * 0.453592;

  // Mifflin-St Jeor BMR
  let bmr;
  if (_selectedSex === 'male') {
    bmr = 10 * weightKg + 6.25 * heightCm - 5 * age + 5;
  } else {
    bmr = 10 * weightKg + 6.25 * heightCm - 5 * age - 161;
  }

  const tdee = Math.round(bmr * activity);
  const calories = Math.round(tdee + goalDelta);

  // Macros: protein ~1g/lb bodyweight, fat ~25% cals, carbs fill the rest
  const protein = Math.round(weightLbs * 1.0);
  const fat = Math.round((calories * 0.25) / 9);
  const carbs = Math.round((calories - (protein * 4) - (fat * 9)) / 4);

  _tdeeResults = { calories, protein, carbs: Math.max(0, carbs), fat };

  document.getElementById('res-cal').textContent = calories;
  document.getElementById('res-p').textContent = protein + 'g';
  document.getElementById('res-c').textContent = Math.max(0, carbs) + 'g';
  document.getElementById('res-f').textContent = fat + 'g';
  document.getElementById('res-note').textContent = `BMR: ${Math.round(bmr)} kcal · TDEE: ${tdee} kcal · Based on Mifflin-St Jeor formula`;
  document.getElementById('tdee-result').style.display = 'block';
  document.getElementById('apply-btn').style.display = '';
}

function applyTDEE() {
  if (!_tdeeResults) return;
  state.settings.calorieGoal = _tdeeResults.calories;
  state.settings.proteinGoal = _tdeeResults.protein;
  state.settings.carbGoal = _tdeeResults.carbs;
  state.settings.fatGoal = _tdeeResults.fat;
  save();
  closeModal();
  render();
  toast('✓ Goals updated!');
}

  return `
  <div class="flex items-center gap-12" style="margin-bottom:16px">
    <span style="font-size:44px">${prep.emoji||'🍱'}</span>
    <div>
      <div style="font-size:18px;font-weight:800">${prep.name}</div>

}
